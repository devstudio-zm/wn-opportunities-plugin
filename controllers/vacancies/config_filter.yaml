scopes:
    status:
        label: Status
        type: switch
        conditions:
            - closing_at < now()
            - closing_at is null or closing_at >= now()
    employment_type:
        label: Type
        type: group
        modelClass: ImpulseTechnologies\Opportunities\Models\Vacancy
        options: getEmploymentTypeOptions
        conditions: employment_type in (:filtered)
    draft:
        label: Not published
        type: checkbox
        conditions: is_published = 0
